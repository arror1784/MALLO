<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MALLO — 화면 프로토타입</title>
    <!--
      Pretendard 웹폰트. index.css의 --font-sans 토큰에 이름만 등록해두고
      실제 @font-face를 안 불러오면 시스템 폰트(San Francisco 등)로 폴백되어
      줄마다 미세한 줄높이 차이가 화면 아래로 갈수록 누적된다 — 픽셀 대조
      스크립트(scripts/pixel-diff.mjs)가 정확히 이 패턴으로 잡아냈다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
